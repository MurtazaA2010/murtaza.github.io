<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != 'About' %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Roboto+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header>
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>About</a>
      <a href="{{ '/blogs/' | relative_url }}" {% if page.url == '/blogs/' %}aria-current="page"{% endif %}>Blogs</a>
      <a href="{{ '/achievements/' | relative_url }}" {% if page.url == '/achievements/' %}aria-current="page"{% endif %}>Achievements</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="footer-inner">
      <span class="footer-name">{{ site.title }}</span>
      <div class="footer-years">
        {% for year in site.years %}
          <a href="{{ '/achievements/' | relative_url }}#{{ year }}">{{ year }}</a>
        {% endfor %}
      </div>
    </div>
  </footer>
</body>
</html>
