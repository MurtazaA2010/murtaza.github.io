<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != 'About' %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Roboto+Serif:ital,opsz,wght@0,8..144,300;0,8..144,400;0,8..144,500;1,8..144,300;1,8..144,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <style>html { background: #0d0d0f; }</style>
</head>
<body>
  <header>
    <p class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
    <nav>
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>About</a>
      <a href="{{ '/blogs/' | relative_url }}" {% if page.url == '/blogs/' %}aria-current="page"{% endif %}>Blogs</a>
      <a href="{{ '/achievements/' | relative_url }}" {% if page.url == '/achievements/' %}aria-current="page"{% endif %}>Achievements</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p class="footer-label">Years</p>
    <p class="years">
      {% for year in site.years %}
        <a href="{{ '/achievements/' | relative_url }}#{{ year }}">{{ year }}</a>
      {% endfor %}
    </p>
  </footer>
</body>
</html>
