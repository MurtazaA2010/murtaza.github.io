<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header>
    <p class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
    <nav>
      <a href="{{ '/' | relative_url }}">About</a>
      <a href="{{ '/blogs/' | relative_url }}">Blogs</a>
      <a href="{{ '/achievements/' | relative_url }}">Achievements</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>Years</p>
    <p class="years">
      {% for year in site.years %}
        <a href="{{ '/achievements/' | relative_url }}#{{ year }}">{{ year }}</a>{% unless forloop.last %} · {% endunless %}
      {% endfor %}
    </p>
  </footer>
</body>
</html>
